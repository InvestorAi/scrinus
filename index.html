<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d1417" />
    <title>KERYX — AI Church Presentation & Ministry OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="src/styles.css" />
    <script>
      window.addEventListener('error', function(e) {
        console.error('[KERYX ERROR]', e.error || e.message);
        const existing = document.getElementById('keryx-fatal-error');
        if (!existing) {
          const errDiv = document.createElement('div');
          errDiv.id = 'keryx-fatal-error';
          errDiv.style.cssText = 'position:fixed;bottom:20px;right:20px;max-width:420px;padding:16px 20px;background:#1a252c;border:1px solid #df654e;border-radius:10px;color:#fff;z-index:999999;font-family:sans-serif;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,0.6);';
          errDiv.innerHTML = '<strong style="color:#df654e;display:block;margin-bottom:6px;">KERYX Notice</strong><span>' + (e.message || 'Operation recovered safely.') + '</span>';
          document.body.appendChild(errDiv);
          setTimeout(() => errDiv.remove(), 6000);
        }
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/app/main.js"></script>
  </body>
</html>
